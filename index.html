<!DOCTYPE html>
<html>
<head>
    <title>Thayam Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="board">

    <div class="arm vertical">
        <div class="cell"></div><div class="cell x"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div>

        <div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div>

        <div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div>
    </div>

    
    <div class="middle">

        <div class="arm horizontal">
            <div class="cell"></div><div class="cell"></div><div class="cell x"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div>

            <div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div>

            <div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div>
        </div>

    
        <div class="center"></div>

    
        <div class="arm horizontal">
            <div class="cell"></div><div class="cell"></div><div class="cell x"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div>

            <div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div>

            <div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div>
        </div>

    </div>

    <div class="arm vertical">
        <div class="cell"></div><div class="cell x"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div>

        <div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div>

        <div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div>
    </div>

</div>

</body>
</html>
